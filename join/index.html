          };
        });
        var add = qEl.querySelector("[data-add]"), other = document.getElementById("other");
        if (add) add.onclick = function () { other.hidden = false; other.focus(); };
        if (other) other.onkeydown = function (e) {
          if (e.key === "Enter" && other.value.trim()) { e.preventDefault(); e.stopPropagation(); arr.push(other.value.trim()); render(); }
        };
        nb.onclick = function () { if (arr.length < (q.min || 0)) return setErr("Pick at least one."); next(); };
      }

      if (q.type === "price") {
        inp.oninput = function () {
          inp.value = inp.value.replace(/[^\d]/g, ""); S.price = inp.value;
          nb.firstChild.nodeValue = S.price ? "Continue " : "Skip ";
          qEl.querySelectorAll("[data-p]").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.p === S.price)); });
        };
        qEl.querySelectorAll("[data-p]").forEach(function (c) { c.onclick = function () { S.price = c.dataset.p; inp.value = c.dataset.p; inp.oninput(); }; });
        nb.onclick = next;
      }

      if (q.type === "textarea") {
        var cnt = document.getElementById("count");
        inp.oninput = function () {
          S.bio = inp.value; var n = inp.value.length;
          cnt.textContent = n + " / " + q.max + (n && n < q.min ? " · " + (q.min - n) + " more characters" : "");
          nb.disabled = n > 0 && n < q.min;
          nb.firstChild.nodeValue = n ? "Continue " : "Skip ";
        };
        inp.oninput();
        nb.onclick = function () { var n = (S.bio || "").length; if (!n || n >= q.min) next(); };
      }

      if (q.type === "tz") {
        document.getElementById("tzsel").onchange = function (e) { S.tz = e.target.value; };
        qEl.querySelectorAll("[data-lang]").forEach(function (c) {
          c.onclick = function () { var l = c.dataset.lang, k = S.langs.indexOf(l); if (k >= 0) S.langs.splice(k, 1); else S.langs.push(l); c.setAttribute("aria-pressed", String(k < 0)); };
        });
        nb.onclick = function () { if (!S.langs.length) return setErr("Pick at least one language."); next(); };
      }

      if (q.type === "plan") {
        var pn = document.getElementById("plan-note");
        var NOTES = {
          monthly: "Next you’ll confirm the paid terms. Stripe comes after that.",
          annual: "Next you’ll confirm the paid terms. Stripe comes after that.",
          chat: "📞 Booking opened in a new tab. Once you've picked a time, continue here."
        };
        function choose(plan) {
          S.plan = plan;
          if (pn) { pn.textContent = NOTES[plan] || ""; pn.hidden = !NOTES[plan]; }
          if (nb) nb.firstChild.nodeValue = "Continue ";
        }
        qEl.querySelectorAll("[data-plan]").forEach(function (a) {
          a.addEventListener("click", function () {
            choose(a.dataset.plan);
            if (a.dataset.plan === "monthly" || a.dataset.plan === "annual") next();
          });
        });
        var bc = document.getElementById("book-call");
        if (bc) bc.addEventListener("click", function () { choose("chat"); });
        var sw = qEl.querySelector("[data-switch-career]");
        if (sw) sw.onclick = function () { S.ctype = "career"; S.plan = "free"; render(); };
        nb.onclick = next;
      }

      if (q.type === "review") {
        var ag = document.getElementById("agree");
        ag.onchange = function () { S.agree = ag.checked; nb.disabled = !ag.checked; };
        qEl.querySelectorAll("[data-edit]").forEach(function (b) {
          b.onclick = function () { var i = Q.findIndex(function (x) { return x.id === b.dataset.edit; }); history.push(idx); idx = i; dir = -1; render(); };
        });
        nb.onclick = function () { if (S.agree) next(); };
      }

      if (q.type === "paidTerms") {
        var pt = document.getElementById("paid-terms");
        pt.onchange = function () { S.paidTerms = pt.checked; nb.disabled = !pt.checked; };
        nb.onclick = function () { if (S.paidTerms) next(); };
      }

      if (q.type === "pay") {
        var open = document.getElementById("open-stripe");
        if (open) open.addEventListener("click", function () { S.checkoutOpened = true; });
        nb.onclick = next;
      }

    }

    document.addEventListener("keydown", function (e) {
      var q = Q[idx];
      var tag = (e.target.tagName || "").toLowerCase();
      if (e.key === "Enter") {
        if (tag === "textarea" && !(e.metaKey || e.ctrlKey)) return;
        if (e.target.id === "other") return;
        if (tag === "button" && !e.target.hasAttribute("data-next")) return;
        var nb = qEl.querySelector("[data-next]");
        if (nb && !nb.disabled) { e.preventDefault(); nb.click(); }
        return;
      }
      if (q.type === "single" && tag !== "input" && tag !== "textarea" && !e.metaKey && !e.ctrlKey) {
        var k = KEYS.indexOf(e.key.toUpperCase());
        var opts = qEl.querySelectorAll(".opt");
        if (k >= 0 && opts[k]) opts[k].click();
      }
    });

    function confetti() {
      var box = document.createElement("div"); box.className = "confetti";
      var colors = ["#0a0a0a", "#15803d", "#f59e0b", "#6b6b6b", "#e5e7eb"];
      for (var i = 0; i < 70; i++) {
        var p = document.createElement("i");
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = Math.random() * 0.6 + "s";
        p.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
        box.appendChild(p);
      }
      document.body.appendChild(box);
      setTimeout(function () { box.remove(); }, 3200);
    }

    render();
  })();
  </script>
</body>
</html>
