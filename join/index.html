    footer.site { border-top: 1px solid var(--border); padding: 1.4rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; }

    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

  <script>
  (function () {
    var TYPES = [
      { v: "career", ico: "💼", label: "Career", sub: "Job search, resumes, career change" },
      { v: "life", ico: "🌱", label: "Life", sub: "Transitions, confidence, direction" },
      { v: "financial", ico: "💰", label: "Financial", sub: "Budgeting, debt, money habits" },
      { v: "relationship", ico: "💬", label: "Relationship", sub: "Dating, breakups, couples" },
      { v: "business", ico: "🚀", label: "Business", sub: "Starting, growing, freelancing" },
      { v: "wellness", ico: "🧘", label: "Health & wellness", sub: "Stress, energy, routines" }
    ];
    var OFFERS = {
      career: ["Resume review & writing", "LinkedIn profile", "Interview prep", "Job search strategy", "Career change", "Salary negotiation", "Leadership & executive", "Returning to work"],
      life: ["Life transitions", "Confidence", "Goals & habits", "Starting over", "Purpose & direction", "Work–life balance"],
      financial: ["Budgeting", "Debt payoff", "Saving & emergency fund", "Money mindset", "Couples & money", "Retirement readiness"],
      relationship: ["Dating", "Breakups & divorce recovery", "Couples communication", "Co-parenting", "Family dynamics"],
      business: ["Starting a business", "Marketing & growth", "Freelancing", "Leadership & teams"],
      wellness: ["Stress", "Sleep & energy", "Nutrition habits", "Fitness habits"]
    };
    var KEYS = "ABCDEFGHIJ";
    var S = { offers: [], levels: [], langs: ["English"] };

    function first() { return (S.name || "").trim().split(/\s+/)[0] || ""; }
    function coachName() { return first() ? "Coach " + first() : "Coach"; }
    function typeLabel() { var t = TYPES.find(function (x) { return x.v === S.ctype; }); return t ? t.label : ""; }
    function isCareer() { return S.ctype === "career"; }

    var Q = [
      { id: "welcome", type: "welcome" },
      { id: "name", type: "text", title: function () { return "Let's start simple. What's your name?"; }, ph: "First and last name", req: true, auto: "name" },
      { id: "email", type: "email", title: function () { return "Nice to meet you, " + coachName() + "! What's your email?"; }, sub: "We'll use it to send you updates about relevant opportunities and our partner network.", ph: "you@example.com", req: true, auto: "email" },
      { id: "title", type: "text", title: function () { return "How do you describe yourself professionally?"; }, sub: "How you'd introduce yourself to a potential client in a few words.", ph: "e.g. Career & Executive Coach", req: true },
      { id: "website", type: "url", optional: true, title: function () { return "Where can we learn more about your work?"; }, sub: "Your website, or LinkedIn if you don't have one. We may review what you've published there to better understand your practice, who you serve, and how you coach.", ph: "yourwebsite.com" },
      { id: "ctype", type: "single", grid: true, title: function () { return "What kind of coach are you?"; }, sub: "Pick your main focus. You can add other areas later.", options: function () { return TYPES; } },
      { id: "offers", type: "multi", title: function () { return "What do you help " + typeLabel().toLowerCase() + " clients with?"; }, sub: "Select all that apply. Specific answers mean better matches.", options: function () { return OFFERS[S.ctype] || []; }, other: true, min: 1,
        note: function () { return S.ctype === "financial" ? "ℹ️ Coach-Halo introduces financial <b>coaches</b>, not investment, tax, or legal advisors." : ""; } },
      { id: "levels", type: "multi", optional: true, when: isCareer, title: function () { return "Who do you usually work with?"; }, options: function () { return ["Students & entry level", "Mid-career", "Senior & managers", "Executives"]; } },
      { id: "industries", type: "text", optional: true, when: isCareer, title: function () { return "Any industries you know especially well?"; }, sub: "Helps us match people in your space.", ph: "e.g. Tech, healthcare, education" },
      { id: "ideal", type: "textarea", title: function () { return "Who is your ideal client?"; }, sub: "Who you most want to work with and what they need help with. We use this to match you with relevant opportunities. Please leave out client names and other personal details.", ph: function () { return isCareer() ? "Mid-career managers changing fields…" : "People going through a big life change who want…"; }, min: 20, max: 1000 },
      { id: "tz", type: "tz", title: function () { return "Where do you coach from?"; }, sub: "So we match people in time zones and languages that work for you." },
      { id: "heard", type: "single", optional: true, grid: true, title: function () { return "Last one! How did you hear about us?"; }, options: function () { return ["Job-Halo", "LinkedIn", "Another coach", "Google", "ChatGPT", "Other"].map(function (x) { return { v: x, label: x }; }); } },
      { id: "review", type: "review" },
      { id: "done", type: "done" }
    ];

    var qEl = document.getElementById("q");
    var barFill = document.querySelector("#bar i");
    var idx = 0, dir = 1, history = [];

    function visible(i) { var q = Q[i]; return !q.when || q.when(); }
    function nextIdx(i) { var j = i + 1; while (j < Q.length && !visible(j)) j++; return j; }
    function progress() {
      var vis = Q.filter(function (_, i) { return visible(i); });
      var pos = vis.indexOf(Q[idx]);
      return Math.max(0, Math.min(1, pos / (vis.length - 1)));
    }
    function stepCount() {
      var vis = Q.filter(function (q, i) { return visible(i) && ["welcome", "review", "done"].indexOf(q.type) < 0; });
      return { n: vis.indexOf(Q[idx]) + 1, of: vis.length };
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function go(i, d) {
      dir = d || 1;
      if (dir > 0) history.push(idx);
      idx = i;
      render();
    }
    var saving = false;
    function signupKey() { return "ch-join:" + String(S.email || "").trim().toLowerCase(); }
    function signupPayload() {
      var sendWelcome = true;
      try { sendWelcome = !sessionStorage.getItem(signupKey()); } catch (e) {}
      var body = {
        name: S.name || "", email: S.email || "", title: S.title || "", website: S.website || "",
        coachType: S.ctype || "", offers: S.offers || [], levels: S.levels || [], industries: S.industries || "",
        ideal: S.ideal || "", tz: S.tz || "", langs: S.langs || [],
        heard: S.heard || "", agree: !!S.agree, sendWelcome: sendWelcome
      };
      return body;
    }
    function next() {
      var j = nextIdx(idx);
      if (Q[idx] && Q[idx].type === "review") { saveThen(j); return; }
      go(j, 1);
    }
    function saveThen(j) {
      if (saving) return;
      if (S.subscribed) { go(j, 1); return; }
      saving = true;
      var nb = qEl.querySelector("[data-next]");
      if (nb) nb.disabled = true;
      setErr("");
      fetch("/.netlify/functions/coach-join", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(signupPayload())
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok && d && d.ok, d: d }; });
      }).then(function (res) {
        saving = false;
        if (!res.ok) {
          if (nb) nb.disabled = false;
          setErr("We couldn't finish signup. Email hello@coach-halo.com and we'll add you.");
          return;
        }
        S.subscribed = true;
        try { sessionStorage.setItem("ch_partner_email", String(S.email || "").trim().toLowerCase()); } catch (e) {}
        S.welcomeSent = !!(res.d && res.d.welcomeSent);
        if (S.welcomeSent) { try { sessionStorage.setItem(signupKey(), "1"); } catch (e) {} }
        go(j, 1);
      }).catch(function () {
        saving = false;
        if (nb) nb.disabled = false;
        setErr("We couldn't finish signup. Email hello@coach-halo.com and we'll add you.");
      });
    }
    function back() { if (history.length) { idx = history.pop(); dir = -1; render(); } }
    function backHTML() {
      return history.length ? '<button type="button" class="btn ghost" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Back</button>' : "";
    }
    function navHTML(label, disabled, backOnly) {
      if (backOnly) return '<div class="nav">' + backHTML() + '</div><div class="err" id="err"></div>';
      return '<div class="nav">' + backHTML() + '<button type="button" class="btn" data-next ' + (disabled ? "disabled" : "") + '>' + (label || "Continue") +
        ' <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>' +
        '<span class="kbd">press <b>Enter ↵</b></span></div><div class="err" id="err"></div>';
    }
    function head(q) {
      var c = stepCount();
      var eb = c.n > 0 ? '<p class="eyebrow"><b>' + c.n + '</b> / ' + c.of + (q.optional ? ' <span class="opt-tag">Optional</span>' : "") + '</p>' : "";
      return eb + '<h1 class="title">' + esc(q.title()) + '</h1>' + (q.sub ? '<p class="sub">' + esc(q.sub) + '</p>' : "");
    }

    function render() {
      var q = Q[idx];
      barFill.style.width = (progress() * 100) + "%";
      var h = "";

      if (q.type === "welcome") {
        h = '<div class="welcome"><p class="eyebrow">For coaches · about 2 minutes · no card needed</p>' +
          '<h1 class="title">Let\'s find your ideal clients.</h1>' +
          '<p class="sub">Tell us about your coaching practice. We\'ll email you previews of potential clients who match your ideal client. Join our partner network, and we\'ll also reach out to those clients for you.</p>' +
          '<div class="perks"><div class="perk"><b>Free</b>lead previews by email when someone matches your ideal client</div><div class="perk"><b>Autopilot</b>we contact matching leads for you once you join a partner platform</div><div class="perk"><b>$0</b>No Coach-Halo fees</div></div>' +
          '<div class="nav"><button type="button" class="btn lg" data-next>Let\'s Get Started <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><span class="kbd">press <b>Enter ↵</b></span></div></div>';
      }

      else if (q.type === "text" || q.type === "email" || q.type === "url") {
        var t = q.type === "text" ? "text" : q.type;
        h = head(q) + '<input class="field" id="inp" type="' + t + '" placeholder="' + esc(q.ph) + '" value="' + esc(S[q.id]) + '"' + (q.auto ? ' autocomplete="' + q.auto + '"' : "") + '>' + navHTML(q.req || S[q.id] ? "Continue" : "Skip");
      }

      else if (q.type === "single") {
        var opts = q.options();
        h = head(q) + '<div class="opts' + (q.grid ? " grid" : "") + '">' + opts.map(function (o, i) {
          var on = S[q.id] === o.v;
          return '<button type="button" class="opt" data-v="' + esc(o.v) + '" aria-pressed="' + on + '"><span class="key">' + KEYS[i] + '</span>' +
            (o.ico ? '<span class="ico">' + o.ico + '</span>' : "") + '<span class="txt"><strong>' + esc(o.label) + '</strong>' + (o.sub ? '<small>' + esc(o.sub) + '</small>' : "") + '</span></button>';
        }).join("") + '</div>' + (q.optional ? navHTML(S[q.id] ? "Continue" : "Skip") : '<div class="nav">' + backHTML() + '</div><div class="err" id="err"></div>') + '<div id="after"></div>';
      }

      else if (q.type === "multi") {
        var list = q.options();
        var arr = S[q.id];
        var extras = arr.filter(function (x) { return list.indexOf(x) < 0; });
        h = head(q) + '<div class="chips">' + list.concat(extras).map(function (o) {
          return '<button type="button" class="chip" data-v="' + esc(o) + '" aria-pressed="' + (arr.indexOf(o) >= 0) + '">' + esc(o) + '</button>';
        }).join("") + (q.other ? '<button type="button" class="chip add" data-add>+ Something else</button>' : "") + '</div>' +
          (q.other ? '<input class="field other-input" id="other" placeholder="Type it and press Enter" hidden>' : "") +
          (q.note && q.note() ? '<div class="note">' + q.note() + '</div>' : "") + navHTML(q.optional && !arr.length ? "Skip" : "Continue", arr.length < (q.min || 0));
      }

      else if (q.type === "textarea") {
        var len = (S[q.id] || "").length;
        var need = !q.optional && len < q.min;
        h = head(q) + '<textarea class="field" id="inp" maxlength="' + q.max + '" placeholder="' + esc(typeof q.ph === "function" ? q.ph() : q.ph) + '">' + esc(S[q.id]) + '</textarea>' +
          '<div class="counter" id="count">' + len + ' / ' + q.max + '</div>' +
          '<div class="nav">' + backHTML() + '<button type="button" class="btn" data-next ' + (need || (q.optional && len && len < q.min) ? "disabled" : "") + '>' + (q.optional ? (len ? "Continue" : "Skip") : "Continue") + ' <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><span class="kbd"><b>⌘</b> + <b>Enter ↵</b></span></div><div class="err" id="err"></div>';
      }

      else if (q.type === "tz") {
        var zones = ["Pacific Time (PT)", "Mountain Time (MT)", "Central Time (CT)", "Eastern Time (ET)", "UK / Ireland", "Central Europe", "Other"];
        var guess = S.tz || (function () { try { var z = Intl.DateTimeFormat().resolvedOptions().timeZone; return /Los_Angeles/.test(z) ? zones[0] : /Denver|Phoenix/.test(z) ? zones[1] : /Chicago/.test(z) ? zones[2] : /New_York/.test(z) ? zones[3] : /London|Dublin/.test(z) ? zones[4] : /Europe/.test(z) ? zones[5] : zones[3]; } catch (e) { return zones[3]; } })();
        S.tz = guess;
        h = head(q) + '<select class="field" id="tzsel">' + zones.map(function (z) { return '<option' + (z === guess ? " selected" : "") + '>' + z + '</option>'; }).join("") + '</select>' +
          '<p class="sub" style="margin:1.4rem 0 .6rem;color:var(--text);font-weight:600">Languages you coach in</p><div class="chips">' +
          ["English", "Spanish", "Portuguese", "French", "German", "Mandarin", "Hindi"].map(function (l) { return '<button type="button" class="chip" data-lang="' + l + '" aria-pressed="' + (S.langs.indexOf(l) >= 0) + '">' + l + '</button>'; }).join("") + '</div>' + navHTML();
      }

      else if (q.type === "review") {
        var rows = [
          ["Name", S.name, "name"], ["Email", S.email, "email"], ["Headline", S.title, "title"], ["Website", S.website, "website"], ["Coach type", typeLabel(), "ctype"],
          ["Helps with", (S.offers || []).join(", "), "offers"]
        ];
        if (isCareer()) {
          rows.push(["Works with", S.levels.join(", "), "levels"], ["Industries", S.industries, "industries"]);
        }
        rows.push(["Ideal client", S.ideal ? S.ideal.slice(0, 80) + (S.ideal.length > 80 ? "…" : "") : "", "ideal"]);
        rows.push(["Based in", S.tz + " · " + S.langs.join(", "), "tz"]);
        h = '<p class="eyebrow">Almost done</p><h1 class="title">Does everything look right?</h1><p class="sub">You can edit any answer now, or fill in anything you skipped later.</p>' +
          '<div class="review">' + rows.map(function (r) { return '<div class="r"><span>' + r[0] + '</span><span' + (r[1] ? "" : ' style="color:var(--muted)"') + '>' + esc(r[1] || "Add later") + '</span><button type="button" data-edit="' + r[2] + '">Edit</button></div>'; }).join("") + '</div>' +
          '<label class="agree"><input type="checkbox" id="agree"' + (S.agree ? " checked" : "") + '><span>I agree to the <a href="/coach-terms/" target="_blank" rel="noopener">Coach Terms</a> and have read the <a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a>. Coach-Halo uses these answers, along with information I\'ve published (like my website or LinkedIn), to understand my practice and match me with relevant coaching opportunities.</span></label>' +
          navHTML("Looks good, let me in", !S.agree);
      }

      else if (q.type === "done") {
        h = '<div class="done"><div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
          '<h1 class="title">You\'re in!</h1>' +
          '<p class="sub">Your coaching information has been saved. Here\'s how Coach-Halo works for you.</p>' +
          '<div class="tiers">' +
          '<div class="tier on"><span class="tag">Active now · Free</span><strong>Lead previews</strong><p>When we find a potential client who matches your ideal client, we\'ll email you a preview of who they are and what they\'re looking for.</p></div>' +
          '<div class="tier"><span class="tag">Partners</span><strong>Referrals on autopilot</strong><p>We reach out to matching leads for you and direct them to your coaching profile or website. You don\'t need to do anything.</p></div>' +
          '</div>' +
          '<div class="partner-cta" id="partner-cta"><h2>How to get referrals on autopilot</h2>' +
          '<ol class="steps"><li><strong>Join a partner platform through our link</strong> (MentorCruise, Coachful, Paperbell, or Simply.Coach).</li><li><strong>Share your profile link with us</strong> on the partners page.</li><li><strong>We verify your eligibility</strong> and email you as soon as your referrals are active.</li></ol>' +
          '<a class="btn lg" href="/partners/">Explore Our Partner Network <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' +
          '<p class="fine">No Coach-Halo subscription required. Coachful, Paperbell, and Simply.Coach require an active paid plan started through our link; MentorCruise requires an approved mentor profile. Already on one of these platforms? Submit your profile for review.</p>' +
          '<button type="button" class="link" id="later">Not now, I\'ll stick with lead previews</button></div>' +
          '<div class="note" id="later-note" style="text-align:left" hidden><div>No problem. You\'ll keep getting lead previews by email. Whenever you\'re ready, join a partner platform at <a href="/partners/">coach-halo.com/partners</a> to get referrals on autopilot.</div></div>' +
          (S.welcomeSent ? '<div class="note" style="text-align:left"><div><strong>Keep an eye on your inbox.</strong><br>Your welcome email is on its way to ' + esc(S.email) + '. If it lands in Promotions or Spam, move it to your Primary inbox and add joaquinh@coach-halo.com to your contacts.</div></div>' : '') +
          '</div>';
        confetti();
      }

      qEl.innerHTML = h;
      qEl.className = "q";
      void qEl.offsetWidth;
      qEl.className = "q enter" + (dir < 0 ? " rev" : "");
      bind(q);
    }

    function setErr(msg) { var e = document.getElementById("err"); if (e) e.textContent = msg || ""; }

    function bind(q) {
      var inp = document.getElementById("inp");
      var nb = qEl.querySelector("[data-next]");
      var bb = qEl.querySelector("[data-back]");
      if (bb) bb.onclick = back;
      if (inp) setTimeout(function () { inp.focus(); }, 60);

      if (q.type === "welcome") nb.onclick = next;

      if (q.type === "text" || q.type === "email" || q.type === "url") {
        inp.oninput = function () { S[q.id] = inp.value; if (!q.req) nb.firstChild.nodeValue = inp.value ? "Continue " : "Skip "; setErr(""); };
        nb.onclick = function () {
          var v = (inp.value || "").trim();
          if (q.type === "url" && v && !/^https?:\/\//i.test(v)) v = "https://" + v;
          S[q.id] = v;
          if (q.req && !v) return setErr("Please fill this in to continue.");
          if (q.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return setErr("That email doesn't look quite right.");
          if (q.type === "url" && v && !/^https?:\/\/\S+\.\S+/.test(v)) return setErr("That link doesn't look quite right.");
          next();
        };
      }

      if (q.type === "single") {
        qEl.querySelectorAll(".opt").forEach(function (b) {
          b.onclick = function () {
            S[q.id] = b.dataset.v;
            if (q.id === "ctype") S.offers = [];
            qEl.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
            b.classList.add("flash");
            var msg = q.after && q.after();
            var a = document.getElementById("after");
            if (msg && a) a.innerHTML = '<div class="note ok">' + esc(msg) + '</div>';
            setTimeout(next, msg ? 1100 : 380);
          };
        });
        if (nb) nb.onclick = next;
      }

      if (q.type === "multi") {
        var arr = S[q.id];
        function sync() {
          nb.disabled = arr.length < (q.min || 0);
          if (q.optional) nb.firstChild.nodeValue = arr.length ? "Continue " : "Skip ";
        }
        qEl.querySelectorAll(".chip[data-v]").forEach(function (c) {
          c.onclick = function () {
            var v = c.dataset.v, k = arr.indexOf(v);
            if (k >= 0) arr.splice(k, 1); else arr.push(v);
            c.setAttribute("aria-pressed", String(k < 0)); sync();
          };
        });
        var add = qEl.querySelector("[data-add]"), other = document.getElementById("other");
        if (add) add.onclick = function () { other.hidden = false; other.focus(); };
        if (other) other.onkeydown = function (e) {
          if (e.key === "Enter" && other.value.trim()) { e.preventDefault(); e.stopPropagation(); arr.push(other.value.trim()); render(); }
        };
        nb.onclick = function () { if (arr.length < (q.min || 0)) return setErr("Pick at least one."); next(); };
      }

      if (q.type === "textarea") {
        var cnt = document.getElementById("count");
        inp.oninput = function () {
          S[q.id] = inp.value; var n = inp.value.length;
          cnt.textContent = n + " / " + q.max + (n && n < q.min ? " · " + (q.min - n) + " more characters" : "");
          nb.disabled = q.optional ? (n > 0 && n < q.min) : n < q.min;
          if (q.optional) nb.firstChild.nodeValue = n ? "Continue " : "Skip ";
        };
        inp.oninput();
        nb.onclick = function () {
          var n = (S[q.id] || "").length;
          if (q.optional) { if (!n || n >= q.min) next(); return; }
          if (n < q.min) return setErr("Add a bit more detail to continue.");
          next();
        };
      }

      if (q.type === "tz") {
        document.getElementById("tzsel").onchange = function (e) { S.tz = e.target.value; };
        qEl.querySelectorAll("[data-lang]").forEach(function (c) {
          c.onclick = function () { var l = c.dataset.lang, k = S.langs.indexOf(l); if (k >= 0) S.langs.splice(k, 1); else S.langs.push(l); c.setAttribute("aria-pressed", String(k < 0)); };
        });
        nb.onclick = function () { if (!S.langs.length) return setErr("Pick at least one language."); next(); };
      }

      if (q.type === "done") {
        var later = document.getElementById("later");
        later.onclick = function () {
          document.getElementById("partner-cta").hidden = true;
          document.getElementById("later-note").hidden = false;
        };
      }

      if (q.type === "review") {
        var ag = document.getElementById("agree");
        ag.onchange = function () { S.agree = ag.checked; nb.disabled = !ag.checked; };
        qEl.querySelectorAll("[data-edit]").forEach(function (b) {
          b.onclick = function () { var i = Q.findIndex(function (x) { return x.id === b.dataset.edit; }); history.push(idx); idx = i; dir = -1; render(); };
        });
        nb.onclick = function () { if (S.agree) next(); };
      }

    }

    document.addEventListener("keydown", function (e) {
      var q = Q[idx];
      var tag = (e.target.tagName || "").toLowerCase();
      if (e.key === "Enter") {
        if (tag === "textarea" && !(e.metaKey || e.ctrlKey)) return;
        if (e.target.id === "other") return;
        if (tag === "button" && !e.target.hasAttribute("data-next")) return;
        var nb = qEl.querySelector("[data-next]");
        if (nb && !nb.disabled) { e.preventDefault(); nb.click(); }
        return;
      }
      if (q.type === "single" && tag !== "input" && tag !== "textarea" && !e.metaKey && !e.ctrlKey) {
        var k = KEYS.indexOf(e.key.toUpperCase());
        var opts = qEl.querySelectorAll(".opt");
        if (k >= 0 && opts[k]) opts[k].click();
      }
    });

    function confetti() {
      var box = document.createElement("div"); box.className = "confetti";
      var colors = ["#0a0a0a", "#15803d", "#f59e0b", "#6b6b6b", "#e5e7eb"];
      for (var i = 0; i < 70; i++) {
        var p = document.createElement("i");
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = Math.random() * 0.6 + "s";
        p.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
        box.appendChild(p);
      }
      document.body.appendChild(box);
      setTimeout(function () { box.remove(); }, 3200);
    }

    render();
  })();
  </script>
</body>
</html>
