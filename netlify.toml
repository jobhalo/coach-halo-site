# coach-halo.com — static site + findyourcoach match API
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# One events page. The path picks the niche. Existing files win over these rewrites.
[[redirects]]
  from = "/events/:topic"
  to = "/events/index.html"
  status = 200

[[redirects]]
  from = "/events/:topic/"
  to = "/events/index.html"
  status = 200
