# coach-halo.com — static site + findyourcoach match API
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."partner-activation"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Paid checkout is retired. Files and the Stripe webhook stay for existing subscribers.
[[redirects]]
  from = "/join/pay"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/join/pay/*"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/join/onboarding"
  to = "/partners/"
  status = 301
  force = true

[[redirects]]
  from = "/join/onboarding/*"
  to = "/partners/"
  status = 301
  force = true

# One events page. The path picks the niche. Existing files win over these rewrites.
[[redirects]]
  from = "/events/:topic"
  to = "/events/index.html"
  status = 200

[[redirects]]
  from = "/events/:topic/"
  to = "/events/index.html"
  status = 200

# Stories is not a public Coach-Halo surface. Keep files for rollback; hide the URL.
[[redirects]]
  from = "/stories"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/stories/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/stories/*"
  to = "/"
  status = 301
  force = true
